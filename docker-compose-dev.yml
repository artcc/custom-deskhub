services:
  custom-deskhub:
    build:
      context: .
    image: custom-deskhub:dev
    pull_policy: never
    container_name: custom-deskhub-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:${PORT:-3005}"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env-dev}
      GITHUB_USERNAME: ${GITHUB_USERNAME:?Set GITHUB_USERNAME in .env-dev}
      PORT: ${PORT:-3005}
      LOCALHOST: ${LOCALHOST:-http://localhost}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      OPENWEATHER_CITY: ${OPENWEATHER_CITY:-}
      OPENWEATHER_UNITS: ${OPENWEATHER_UNITS:-metric}
    volumes:
      - ./data-dev:/app/data
    networks:
      - deskhub-network
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"require('http').get('http://localhost:' + process.env.PORT + '/display', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  deskhub-network:
    driver: bridge
